<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CSS Spritesheet Generator — combine PNG, JPG, WEBP and SVG images into a single optimized spritesheet with generated CSS, SCSS and JSON. 100% client-side, private by design." />
    <meta property="og:title" content="CSS Spritesheet Generator" />
    <meta property="og:description" content="Combine images into one optimized spritesheet. Fewer requests, easy CSS integration. All processing happens locally in your browser." />
    <meta property="og:image" content="/logo.webp" />
    <title>CSS Spritesheet Generator</title>
    <script>
      // Prevent theme flash: default to system
      try {
        var t = localStorage.getItem('css-spritesheet:theme') || 'system';
        var dark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
